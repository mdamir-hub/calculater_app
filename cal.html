<!DOCTYPE html>
<html>
    <head>
        <title>Calculator app</title>
        <link rel ="stylesheet" text ="text/css" href ="style.css">
    </head>
    <body>
        <div class ="calculator">
            <div class ="heading">
                CALCULATOR
            </div>
            <div id ="display"></div>
            <div class="buttons">

            <button>AC</button>
            <button>+/-</button>
            <button>%</button>
            <button class="sign">/</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="sign">*</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="sign">-</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="sign">+</button>

            <div id ="button-zero">0</div>
            <button>.</button>
            <button class="sign">=</button>
        </div>
     </div>
    </body>
</html>
